; RagnaMusic-Theme für Spicetify
; Farben aus RagnaMusic/src/styles/tokens.css. Spicetify macht aus jedem Schlüssel
; die CSS-Variablen --spice-<name> und --spice-rgb-<name>.
;
; Spotify-Fläche         ->  RagnaMusic-Token
; sidebar / player       ->  --desk     (Fensterhintergrund, Player-Leiste)
; main                   ->  --surface  (Panels)
; main-elevated / card   ->  --surface-2
; highlight-elevated     ->  --surface-3
; button                 ->  --accent   (Play-Knopf, aktive Elemente, Fortschritt)
;
; Zusätzliche Schlüssel (like, accent-ink, line, tint, algo-*) nutzt user.css.

[dark]
text               = eceff6
subtext            = a4acbf
main               = 121621
main-elevated      = 1a1f2d
highlight          = 1a1f2d
highlight-elevated = 242a3b
sidebar            = 07090e
player             = 07090e
card               = 1a1f2d
shadow             = 000000
